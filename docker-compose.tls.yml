# HTTPS overlay for the existing local Compose stack.
# Requires AWA_DOMAIN and ACME_EMAIL in the root .env file.
# DNS A/AAAA records must point to this Docker host; inbound TCP 80/443 must be open.
services:
  frontend:
    # Caddy is the only public web entry point. The app remains private on the
    # Compose network; do not publish 5174 in this TLS deployment.
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"
      SECURE_PROXY_SSL_HEADER_ENABLED: "True"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AWA_DOMAIN: ${AWA_DOMAIN:?Set AWA_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - awa_caddy_data:/data
      - awa_caddy_config:/config
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  awa_caddy_data:
  awa_caddy_config:
