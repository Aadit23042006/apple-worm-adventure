
services:
  # ==========================================
  # BACKEND - DJANGO REST API
  # ==========================================
  - type: web
    name: awa-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: DJANGO_DEBUG
        value: "false"

      - key: GAME_NAME
        value: "APPLE WORM ADVENTURE"

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      # PostgreSQL connection
      - key: POSTGRES_DB
        fromDatabase:
          name: awa-postgres
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: awa-postgres
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: awa-postgres
          property: password

      - key: POSTGRES_HOST
        fromDatabase:
          name: awa-postgres
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: awa-postgres
          property: port

      # Frontend integration
      - key: FRONTEND_BASE_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Production security
      - key: SECURE_SSL_REDIRECT
        value: "true"

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: CSRF_COOKIE_SECURE
        value: "true"

      - key: SECURE_PROXY_SSL_HEADER_ENABLED
        value: "true"

      - key: SECURE_HSTS_SECONDS
        value: "31536000"

      # Reward / advertisement configuration
      # Real ad provider is not configured.
      - key: ALLOW_PROVIDER_FREE_DEMO_ADS
        value: "false"

      # Email configuration
      # Console backend does not require SMTP credentials.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"

  # ==========================================
  # FRONTEND - REACT / VITE
  # ==========================================
  - type: web
    name: awa-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: VITE_GAME_NAME
        value: "APPLE WORM ADVENTURE"

      - key: VITE_API_BASE_URL
        sync: false

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
databases:
  - name: awa-postgres
    plan: free
    databaseName: veloop
    user: veloop_user
