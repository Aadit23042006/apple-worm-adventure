services:
  local-https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./caddy/Caddyfile.local-https:/etc/caddy/Caddyfile:ro
      - awa_local_https_data:/data
      - awa_local_https_config:/config
    depends_on:
      - frontend
    networks:
      - awa_existing

volumes:
  awa_local_https_data:
  awa_local_https_config:

networks:
  awa_existing:
    external: true
    name: awa_release_candidate_network
